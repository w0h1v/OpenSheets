# Dependency updates arrive as reviewable pull requests, never silently.
# The cooldown keeps freshly published versions out for a week: most
# malicious releases are detected and unpublished within days, so waiting
# is the cheapest protection there is.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react 7.x supports eslint up to ^9.7. Revisit once it
      # supports eslint 10 (the 10.x bump fails with ERESOLVE until then).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
        update-types: [major, minor, patch]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
